name: LocalCode binaries

on:
  push:
    branches: [localcode-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localcode-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'deviknitkkr/localcode'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      OPENCODE_CHANNEL: preview
      OPENCODE_VERSION: 0.1.0-alpha.1
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test isolation
        working-directory: packages/util
        run: bun test test/global.test.ts test/global-roots.test.ts test/localcode-environment.test.ts test/localcode-discovery.test.ts

      - name: Test local providers
        working-directory: packages/core
        run: bun run script/test.ts test/plugin/provider-ollama.test.ts

      - name: Build standalone executable
        working-directory: packages/cli
        run: bun run script/build.ts --single --skip-install --no-bytecode

      - name: Smoke-test and package executable
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/localcode/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/localcode/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/localcode/cache"
          export XDG_STATE_HOME="$RUNNER_TEMP/localcode/state"
          binary="packages/cli/dist/cli-$PLATFORM/bin/localcode"
          "$binary" --version
          "$binary" --help
          test "$("$binary" debug paths config)" = "$XDG_CONFIG_HOME/localcode"
          "$binary" models
          mkdir -p artifacts
          cp "packages/cli/dist/cli-$PLATFORM/build-inputs.json" artifacts/
          tar -czf "artifacts/localcode-$PLATFORM.tar.gz" -C "packages/cli/dist/cli-$PLATFORM/bin" localcode -C "$GITHUB_WORKSPACE" LICENSE LOCALCODE.md
          wc -c "$binary" "artifacts/localcode-$PLATFORM.tar.gz" | tee artifacts/sizes.txt
          printf '## %s size report\n```\n' "$PLATFORM" >> "$GITHUB_STEP_SUMMARY"
          wc -c "$binary" "artifacts/localcode-$PLATFORM.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 "artifacts/localcode-$PLATFORM.tar.gz" > "artifacts/localcode-$PLATFORM.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localcode-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
